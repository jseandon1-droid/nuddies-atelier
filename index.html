<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Nuddies · Atelier</title>
<meta name="description" content="Build your goddess — the Nuddies trait generator." />
<meta name="theme-color" content="#0B0A0F" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Nuddies" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--void:#0B0A0F;--obsidian:#141119;--obsidian-2:#1C1824;--gold:#C9A34E;--gold-bright:#E7C56A;
    --garnet:#8B2635;--ivory:#EDE6D6;--mauve:#8A8194;--line:rgba(201,163,78,0.22);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--ivory);}
  body{font-family:"Jost",system-ui,sans-serif;min-height:100vh;
    background:radial-gradient(120% 90% at 50% -10%, rgba(201,163,78,0.08), transparent 55%),
      radial-gradient(80% 70% at 50% 120%, rgba(139,38,53,0.10), transparent 60%),var(--void);
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));}
  [hidden]{display:none!important;}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;
    padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:30px;}
  .brand h1{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.26em;font-size:clamp(24px,4.4vw,40px);
    margin:0;line-height:1;background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(14px,2vw,19px);
    color:var(--mauve);margin:8px 0 0;letter-spacing:.02em;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;}
  button{font-family:"Jost",sans-serif;cursor:pointer;border:none;background:none;color:inherit;}
  .btn{font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:12px 20px;border:1px solid var(--line);
    border-radius:2px;color:var(--ivory);background:rgba(201,163,78,0.04);transition:border-color .25s,background .25s,transform .1s;}
  .btn:hover{border-color:var(--gold);background:rgba(201,163,78,0.10);}
  .btn:active{transform:translateY(1px);}
  .btn--gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#231a08;border-color:transparent;font-weight:500;}
  .btn:focus-visible,.step:focus-visible,.thumb:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}
  .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:38px;align-items:start;}
  @media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr);gap:28px;}}
  .grid>*{min-width:0;}
  .frame{position:relative;border:1px solid var(--line);border-radius:3px;
    background:radial-gradient(80% 80% at 50% 40%, var(--obsidian-2), var(--void) 90%);padding:14px;}
  .frame::before,.frame::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold);opacity:.55;}
  .frame::before{top:8px;left:8px;border-right:none;border-bottom:none;}
  .frame::after{bottom:8px;right:8px;border-left:none;border-top:none;}
  canvas{display:block;width:100%;height:auto;border-radius:2px;background:transparent;}
  #shimmer{position:absolute;inset:14px;pointer-events:none;border-radius:2px;opacity:0;
    background:linear-gradient(105deg,transparent 40%,rgba(231,197,106,.5) 50%,transparent 60%);
    background-size:250% 100%;background-position:120% 0;mix-blend-mode:screen;}
  .panel{border:1px solid var(--line);border-radius:3px;background:var(--obsidian);overflow:hidden;margin-bottom:16px;}
  .cat{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid rgba(201,163,78,.08);}
  .cat:last-child{border-bottom:none;}
  .cat .meta{flex:1;min-width:0;}
  .cat .lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mauve);}
  .cat .val{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--ivory);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat .val .count{font-family:"Jost";font-size:11px;letter-spacing:.14em;color:var(--gold);margin-left:8px;}
  .cat.empty .val{color:var(--mauve);font-style:italic;font-size:16px;}
  .stepper{display:flex;gap:6px;}
  .step{width:34px;height:34px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;
    color:var(--ivory);font-size:15px;background:rgba(201,163,78,.04);transition:border-color .2s,background .2s;}
  .step:hover{border-color:var(--gold);background:rgba(201,163,78,.1);}
  .step[disabled]{opacity:.3;cursor:default;}
  .foot{color:var(--mauve);font-size:12px;line-height:1.6;margin-top:6px;letter-spacing:.02em;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>NUDDIES</h1>
      <p>Atelier of the Nu World Order — build your goddess</p>
    </div>
    <div class="actions">
      <button class="btn" id="randomAll">⟳ Summon at Random</button>
      <button class="btn" id="install" hidden>⤓ Install App</button>
      <button class="btn btn--gold" id="download">↓ Save Portrait</button>
    </div>
  </header>
  <div class="grid">
    <section>
      <div class="frame">
        <canvas id="stage" width="1000" height="1000" aria-label="Goddess preview"></canvas>
        <div id="shimmer"></div>
      </div>
    </section>
    <aside>
      <div class="panel" id="controls"></div>
      <p class="foot" id="status">Loading traits…</p>
    </aside>
  </div>
</div>
<script>
/* Manifest-driven generator. Reads traits/manifest.json; category order = layer order (back→front).
   Add a new category's PNGs under traits/<Category>/ and list them in manifest.json — the UI extends automatically.
   Run via a local server or host it (canvas export needs same-origin): e.g.  python3 -m http.server  */
let M=null, SZ=1000, ctx, state={}, imgs={};
const $=id=>document.getElementById(id);

async function boot(){
  try{
    M = await (await fetch('traits/manifest.json')).json();
  }catch(e){ $('status').textContent='Could not load traits/manifest.json — run via a local server (python3 -m http.server) or host it.'; return; }
  SZ = M.canvas||1000;
  const c=$('stage'); c.width=SZ; c.height=SZ; ctx=c.getContext('2d');
  // preload all option images that have files
  const loads=[];
  M.categories.forEach(cat=>{
    state[cat.name]=0;
    cat.options.forEach(o=>{
      if(o.file){
        const src='traits/'+cat.name+'/'+o.file;
        const im=new Image();
        loads.push(new Promise(r=>{ im.onload=im.onerror=r; im.src=src; }));
        imgs[src]=im;
      }
    });
  });
  await Promise.all(loads);
  buildControls(); summon();
  $('status').textContent = tally();
}
function c_path(o){ const cat=M.categories.find(c=>c.options.includes(o)); return cat.name+'/'+o.file; }
function tally(){
  const live=M.categories.filter(c=>c.options.some(o=>o.file)).map(c=>c.name+' ·'+c.options.filter(o=>o.file).length);
  return 'Live: '+live.join('   ');
}
function backdrop(){
  const g=ctx.createRadialGradient(SZ/2,SZ*0.42,0,SZ/2,SZ*0.42,SZ*0.75);
  g.addColorStop(0,'#1C1824'); g.addColorStop(1,'#0B0A0F');
  ctx.fillStyle=g; ctx.fillRect(0,0,SZ,SZ);
}
function hasBackground(){ const b=M.categories.find(c=>c.name==='Background'); return b && b.options[state['Background']] && b.options[state['Background']].file; }
function render(){
  ctx.clearRect(0,0,SZ,SZ);
  if(!hasBackground()) backdrop();
  M.categories.forEach(cat=>{
    const o=cat.options[state[cat.name]];
    if(o && o.file){ const im=imgs['traits/'+cat.name+'/'+o.file]; if(im&&im.complete&&im.naturalWidth) ctx.drawImage(im,0,0,SZ,SZ); }
  });
  document.querySelectorAll('.cat').forEach(row=>{
    const name=row.dataset.cat, o=M.categories.find(c=>c.name===name).options[state[name]];
    row.querySelector('.name').textContent=o.name;
    const cnt=M.categories.find(c=>c.name===name).options.length;
    row.querySelector('.count').textContent=(state[name]+1)+' / '+cnt;
  });
}
function buildControls(){
  const box=$('controls'); box.innerHTML='';
  M.categories.forEach(cat=>{
    const real=cat.options.some(o=>o.file);
    const row=document.createElement('div');
    row.className='cat'+(real?'':' empty'); row.dataset.cat=cat.name;
    row.innerHTML=`<div class="meta"><div class="lbl">${cat.name}</div>
      <div class="val"><span class="name">—</span><span class="count"></span></div></div>
      <div class="stepper">
        <button class="step" data-d="-1" aria-label="Previous ${cat.name}" ${real?'':'disabled'}>‹</button>
        <button class="step" data-d="1"  aria-label="Next ${cat.name}" ${real?'':'disabled'}>›</button></div>`;
    box.appendChild(row);
    if(real) row.querySelectorAll('.step').forEach(b=>b.onclick=()=>{
      const n=cat.options.length; state[cat.name]=(state[cat.name]+ (+b.dataset.d) + n)%n; render();
    });
  });
}
// crypto-backed uniform [0,1) — Math.random is a weak PRNG in some webviews.
function rnd(){ try{ const a=new Uint32Array(1); (self.crypto||self.msCrypto).getRandomValues(a); return a[0]/4294967296; }catch(e){ return Math.random(); } }
function wOf(o){ return (o && o.weight!=null) ? o.weight : 100; }
function draw(cat){ const opts=cat.options, tot=opts.reduce((s,o)=>s+wOf(o),0); let r=rnd()*tot;
  for(let i=0;i<opts.length;i++){ r-=wOf(opts[i]); if(r<=0) return i; } return opts.length-1; }
function pick(cat){
  // Guarantee a visible change: draw uniformly from everything EXCEPT what is showing.
  // Only valid for equally-weighted categories — excluding an option in a weighted one
  // (Special) would wreck its rarity, so that path falls through to the plain draw.
  const w=cat.options.map(wOf), flat=w.every(x=>x===w[0]), cur=state[cat.name], n=cat.options.length;
  if(flat && n>2 && Number.isInteger(cur) && cur>=0 && cur<n){
    let j=Math.floor(rnd()*(n-1)); if(j>=cur) j++; return j;
  }
  return draw(cat);
}
function summon(){ M.categories.forEach(c=>state[c.name]=pick(c)); render(); shimmer(); }
function shimmer(){ const s=$('shimmer'); if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  s.animate([{opacity:0,backgroundPosition:'120% 0'},{opacity:1,offset:.5},{opacity:0,backgroundPosition:'-40% 0'}],{duration:700,easing:'ease-out'}); }
$('randomAll').onclick=summon;
$('download').onclick=async()=>{
  // Highest-quality save: every selected layer must be fully decoded, then repaint and
  // export PNG (lossless) at the manifest canvas size, 1:1 with the source art. Without
  // this guard a layer that failed to decode would silently export a Nuddie missing a trait.
  const sel=M.categories.map(c=>c.options[state[c.name]]).filter(o=>o&&o.file)
                        .map(o=>imgs['traits/'+c_path(o)]);
  await Promise.all(sel.map(im=> im&&im.decode?im.decode().catch(()=>{}):Promise.resolve()));
  const missing=sel.filter(im=>!im||!im.complete||!im.naturalWidth).length;
  if(missing){ alert('Not saved: '+missing+' trait layer(s) failed to load. Reload and try again.'); return; }
  render();
  let url;
  try{ url=$('stage').toDataURL('image/png'); }
  catch(e){ alert('Export blocked on file:// — run via a local server (python3 -m http.server) or host it.'); return; }
  // Installed on a phone, a plain download is unreliable — hand the same lossless PNG to the share sheet
  // (Save Image / Files / Photos). Desktop and browser tabs keep the direct download.
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone&&navigator.canShare){
    try{
      // synchronous data-URL -> bytes keeps the tap's user activation alive for share() on iOS
      const bin=atob(url.split(',')[1]), u8=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      const file=new File([u8],'nuddie.png',{type:'image/png'});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Nuddie'}); return; }
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.download='nuddie.png'; a.href=url; a.click();
};
boot();

/* PWA: offline cache + install. Needs https or localhost; skipped on file://. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let installEvt=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; $('install').hidden=false; });
$('install').onclick=async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; $('install').hidden=true; };
addEventListener('appinstalled',()=>{ installEvt=null; $('install').hidden=true; });
</script>
</body>
</html>
