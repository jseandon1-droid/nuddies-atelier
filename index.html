<style>
  :root{--void:#0B0A0F;--obsidian:#141119;--obsidian-2:#1C1824;--gold:#C9A34E;--gold-bright:#E7C56A;
    --garnet:#8B2635;--ivory:#EDE6D6;--mauve:#8A8194;--line:rgba(201,163,78,0.22);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--void);color:var(--ivory);overflow-x:hidden;max-width:100%;}
  body{font-family:"Jost",system-ui,sans-serif;min-height:100vh;
    background:radial-gradient(120% 90% at 50% -10%, rgba(201,163,78,0.08), transparent 55%),
      radial-gradient(80% 70% at 50% 120%, rgba(139,38,53,0.10), transparent 60%),var(--void);
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1100px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));}
  [hidden]{display:none!important;}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;
    padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:30px;}
  .brand h1{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.26em;font-size:clamp(24px,4.4vw,40px);
    margin:0;line-height:1;background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:clamp(14px,2vw,19px);
    color:var(--mauve);margin:8px 0 0;letter-spacing:.02em;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;}
  button{font-family:"Jost",sans-serif;cursor:pointer;border:none;background:none;color:inherit;}
  .btn{font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:12px 20px;border:1px solid var(--line);
    border-radius:2px;color:var(--ivory);background:rgba(201,163,78,0.04);transition:border-color .25s,background .25s,transform .1s;}
  .btn:hover{border-color:var(--gold);background:rgba(201,163,78,0.10);}
  .btn:active{transform:translateY(1px);}
  .btn--gold{background:linear-gradient(180deg,var(--gold-bright),var(--gold));color:#231a08;border-color:transparent;font-weight:500;}
  .btn--gold:hover{background:linear-gradient(180deg,#F1D78A,var(--gold-bright));border-color:transparent;color:#231a08;}
  .btn:focus-visible,.step:focus-visible,.thumb:focus-visible{outline:2px solid var(--gold-bright);outline-offset:2px;}
  .grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:38px;align-items:start;}
  .grid>*{min-width:0;}
  .stage-wrap{position:sticky;top:14px;}
  .stage-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
  .stage-actions .btn{flex:1;text-align:center;}
  @media(max-width:860px){
    .grid{grid-template-columns:1fr;gap:14px;}
    .wrap{padding:calc(18px + env(safe-area-inset-top)) 14px calc(56px + env(safe-area-inset-bottom));}
    header{margin-bottom:16px;padding-bottom:14px;}
    .actions{display:none;}
    .stage-wrap{top:0;z-index:30;padding:6px 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;
      background:linear-gradient(180deg,var(--void) 0%,var(--void) 82%,rgba(11,10,15,0));}
    .frame{max-width:min(52vh,320px);margin:0 auto;padding:8px;}
    .stage-actions{margin-top:10px;max-width:min(52vh,320px);margin-left:auto;margin-right:auto;}
    .stage-actions .btn{padding:10px 12px;font-size:11px;}
  }
  @media(min-width:861px){.stage-actions{display:none;}}
  .frame{position:relative;border:1px solid var(--line);border-radius:3px;
    background:radial-gradient(80% 80% at 50% 40%, var(--obsidian-2), var(--void) 90%);padding:14px;}
  .frame::before,.frame::after{content:"";position:absolute;width:22px;height:22px;border:1px solid var(--gold);opacity:.55;}
  .frame::before{top:8px;left:8px;border-right:none;border-bottom:none;}
  .frame::after{bottom:8px;right:8px;border-left:none;border-top:none;}
  canvas{display:block;width:100%;height:auto;border-radius:2px;background:transparent;}
  #shimmer{position:absolute;inset:14px;pointer-events:none;border-radius:2px;opacity:0;
    background:linear-gradient(105deg,transparent 40%,rgba(231,197,106,.5) 50%,transparent 60%);
    background-size:250% 100%;background-position:120% 0;mix-blend-mode:screen;}
  .panel{border:1px solid var(--line);border-radius:3px;background:var(--obsidian);overflow:hidden;margin-bottom:14px;}
  .cat{display:flex;align-items:center;gap:12px;padding:14px 18px;}
  .cat .meta{cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;}
  .cat.empty .meta{cursor:default;}
  .caret{width:16px;flex:none;color:var(--gold);font-size:11px;transition:transform .22s ease;transform:rotate(-90deg);opacity:.75;}
  .panel.open .caret{transform:rotate(0deg);}
  .panel.open .cat{border-bottom:1px solid rgba(201,163,78,.08);}
  .thumbs{display:none;}
  .panel.open .thumbs{display:grid;}
  .cat .meta{flex:1;min-width:0;}
  .cat .meta > div{flex:1;min-width:0;}
  .stepper{flex:none;}
  .cat .lbl{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--mauve);}
  .cat .val{font-family:"Cormorant Garamond",serif;font-size:20px;color:var(--ivory);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cat .val .count{font-family:"Jost";font-size:11px;letter-spacing:.14em;color:var(--gold);margin-left:8px;}
  .cat.empty .val{color:var(--mauve);font-style:italic;font-size:15px;}
  .stepper{display:flex;gap:6px;}
  .step{width:34px;height:34px;border:1px solid var(--line);border-radius:2px;display:grid;place-items:center;
    color:var(--ivory);font-size:15px;background:rgba(201,163,78,.04);transition:border-color .2s,background .2s;}
  .step:hover{border-color:var(--gold);background:rgba(201,163,78,.1);}
  .step[disabled]{opacity:.3;cursor:default;}
  .thumbs{grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:8px;padding:14px 18px 16px;
    max-height:46vh;overflow-y:auto;align-content:start;align-items:start;}
  .thumb{border:1px solid var(--line);border-radius:3px;overflow:hidden;aspect-ratio:1;background:var(--void);
    padding:0;transition:border-color .2s;position:relative;}
  .thumb img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;}
  .thumb.bgthumb img{object-fit:cover;}
  .thumb:hover{border-color:var(--gold);}
  .thumb[aria-pressed="true"]{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright) inset;}
  .thumb.none{display:grid;place-items:center;color:var(--mauve);font-size:9px;letter-spacing:.1em;}
  .frame.loading::after{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.15;}}
  .install-row{margin-top:10px;}
  @media(max-width:860px){.install-row{max-width:min(52vh,320px);margin-left:auto;margin-right:auto;}}
  .install-row .btn{width:100%;}
  @media(min-width:861px){.install-row{display:none!important;}}
  .sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:rgba(5,4,8,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:20px;}
  .sheet-card{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--obsidian);border:1px solid var(--line);
    border-radius:4px;padding:18px;text-align:center;}
  .sheet-card img{display:block;width:100%;height:auto;border-radius:2px;background:var(--void);
    -webkit-touch-callout:default;user-select:auto;}
  .sheet-hint{font-family:"Cormorant Garamond",serif;font-size:18px;color:var(--ivory);margin:14px 0 4px;}
  .sheet-meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 14px;}
  .sheet-actions{display:flex;flex-direction:column;gap:10px;}
  .sheet-actions .btn{display:block;text-decoration:none;text-align:center;}
  .foot{color:var(--mauve);font-size:12px;line-height:1.6;margin-top:8px;letter-spacing:.02em;}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>NUDDIES</h1>
      <p>Atelier of the Nu World Order — build your goddess</p>
    </div>
    <div class="actions">
      <button class="btn" id="install" hidden>⤓ Install App</button>
      <button class="btn" id="randomAll">⟳ Summon at Random</button>
      <button class="btn btn--gold" id="download">↓ Save Portrait</button>
    </div>
  </header>
  <div class="grid">
    <section>
      <div class="stage-wrap">
        <div class="frame">
          <canvas id="stage" width="1000" height="1000" aria-label="Goddess preview"></canvas>
          <div id="shimmer"></div>
        </div>
        <div class="stage-actions">
          <button class="btn" id="randomAllM">⟳ Random</button>
          <button class="btn btn--gold" id="downloadM">↓ Save</button>
        </div>
        <div class="install-row" id="installRowM" hidden><button class="btn" id="installM">⤓ Install App</button></div>
      </div>
    </section>
    <aside>
      <div id="controls"></div>
      <p class="foot" id="status">Loading traits…</p>
    </aside>
  </div>
</div>
<div class="sheet" id="saveSheet" hidden role="dialog" aria-modal="true" aria-label="Save your Nuddie">
  <div class="sheet-card">
    <img id="saveImg" alt="Your Nuddie, ready to save" />
    <p class="sheet-hint" id="saveHint">Your Nuddie is ready</p>
    <p class="sheet-meta">1000 × 1000 PNG · lossless · full quality</p>
    <div class="sheet-actions">
      <button class="btn btn--gold" id="saveShare" hidden>Save to Photos / Share</button>
      <a class="btn btn--gold" id="saveLink" download="nuddie.png">↓ Download PNG</a>
      <button class="btn" id="saveClose">Close</button>
    </div>
  </div>
</div>
<script>
/* Nuddies Atelier — the live generator. Manifest-driven: reads traits/manifest.json at runtime;
   category order = layer order (back→front). Add PNGs under traits/<Category>/, list them in the
   manifest and run tools/rebuild_thumbs.py — the UI extends automatically.
   Loading is on demand: only the layers on the canvas (and thumbnails of a picker you open) are
   fetched, so the page is usable in seconds on a phone. Canvas + saves always use the full
   1000×1000 PNGs, drawn 1:1. Serve it (https or localhost); file:// blocks canvas export. */
let M=null, CATS=[], SZ=1000;
const canvas=document.getElementById('stage'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
const state={}; const imgs=new Map();
const $=id=>document.getElementById(id);
let _raf=false; function scheduleRender(){ if(_raf)return; _raf=true; requestAnimationFrame(()=>{ _raf=false; render(); }); }
// Layers load as lossless WebP (pixel-identical to the PNG masters, ~40% smaller). Each image is
// decoded off the main thread before it is ever drawn, so compositing never stutters. If a
// browser can't decode WebP, that layer silently falls back to its PNG.
// Memory cap: every decoded 1000×1000 layer holds ~4 MB of RAM, and phones (iPhone Safari above
// all) stutter or reload the page once dozens pile up. Only the most recent MAX_IMGS layers are
// kept decoded; older ones are released and come back instantly from the offline cache if needed.
const MAX_IMGS=56;
function getImg(src, png){ let im=imgs.get(src);
  if(im){ imgs.delete(src); imgs.set(src,im); return im; }       // mark as recently used
  im=new Image(); im.decoding='async';
  im.onload=()=>{ (im.decode?im.decode():Promise.resolve()).catch(()=>{}).then(()=>{ im._ok=true; scheduleRender(); }); };
  im.onerror=()=>{ if(png&&im.src.indexOf(png)<0){ im.src=png; return; } im._bad=true; scheduleRender(); };
  im.src=src; imgs.set(src,im); trimImgs(); return im; }
function trimImgs(){
  if(imgs.size<=MAX_IMGS) return;
  const keep=new Set(); const mark=st=>CATS.forEach(c=>{ const o=c.options[st[c.name]]; if(o&&o.src) keep.add(o.src); });
  mark(state); if(drawn) mark(drawn); rollQ.forEach(mark);
  for(const [k,im] of imgs){ if(imgs.size<=MAX_IMGS) break; if(!keep.has(k)){ imgs.delete(k); im.onload=im.onerror=null; im.src=''; } }
}
function layer(o){ return getImg(o.src, o.png); }
function backdrop(){ const g=ctx.createRadialGradient(SZ/2,SZ*0.42,0,SZ/2,SZ*0.42,SZ*0.75);
  g.addColorStop(0,'#1C1824'); g.addColorStop(1,'#0B0A0F'); ctx.fillStyle=g; ctx.fillRect(0,0,SZ,SZ); }
function bgActive(){ const b=CATS.find(c=>c.name==='Background'); return b && b.options[state['Background']] && b.options[state['Background']].src; }
function selected(){ return CATS.map(c=>c.options[state[c.name]]).filter(o=>o&&o.src); }
// The canvas only ever shows a complete Nuddie: while a new layer downloads, the previous
// portrait stays up (with a soft pulse) and the whole new look swaps in at once — no pop-in.
function stateKey(){ return CATS.map(c=>state[c.name]).join(','); }
// The picture, the trait names and the shimmer always change together, in one frame, once every
// layer of the new look is decoded — so what you read always matches what you see.
let drawn=null, wantShimmer=false;
function snapshot(){ const s={}; CATS.forEach(c=>s[c.name]=state[c.name]); return s; }
function render(){
  const ims=selected().map(layer), pending=ims.filter(im=>!im._ok&&!im._bad).length;
  document.querySelector('.frame').classList.toggle('loading', pending>0);
  if(!pending){
    ctx.clearRect(0,0,SZ,SZ);
    if(!bgActive()) backdrop();
    ims.forEach(im=>{ if(im._ok) ctx.drawImage(im,0,0,SZ,SZ); });
    drawn=snapshot(); updateRows();
    if(wantShimmer){ wantShimmer=false; shimmer(); }
  } else if(!drawn) updateRows();
  planNext();
}
function updateRows(){
  document.querySelectorAll('.cat').forEach(row=>{
    const c=CATS.find(x=>x.name===row.dataset.cat); const o=c.options[state[c.name]];
    row.querySelector('.name').textContent=o.name; row.querySelector('.name').title=o.name;
    row.querySelector('.count').textContent=(state[c.name]+1)+' / '+c.options.length;
    row.parentElement.querySelectorAll('.thumb').forEach((t,i)=>t.setAttribute('aria-pressed', i===state[c.name]));
  });
}
function shimmer(){ const s=$('shimmer'); if(!s||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  s.animate([{opacity:0},{opacity:1,offset:.5},{opacity:0}],{duration:700,easing:'ease-out'}); }
// --- randomness ---------------------------------------------------------
// crypto-backed uniform [0,1): Math.random in some in-app webviews is a weak PRNG
// that visibly repeats across rolls. Falls back cleanly where crypto is absent.
function rnd(){ try{ const a=new Uint32Array(1); (self.crypto||self.msCrypto).getRandomValues(a); return a[0]/4294967296; }catch(e){ return Math.random(); } }
function wOf(o){ return (o && o.weight!=null) ? o.weight : 100; }
function draw(c){ const t=c.options.reduce((s,o)=>s+wOf(o),0); let r=rnd()*t;
  for(let i=0;i<c.options.length;i++){ r-=wOf(c.options[i]); if(r<=0) return i; } return c.options.length-1; }
function pick(c){
  // Guarantee a visible change: draw uniformly from everything EXCEPT what is already
  // showing. Only valid where all options are equally likely — excluding an option in a
  // weighted category (Special) would wreck its intended rarity, so that path is untouched.
  const w=c.options.map(wOf), flat=w.every(x=>x===w[0]), cur=state[c.name], n=c.options.length;
  if(flat && n>2 && Number.isInteger(cur) && cur>=0 && cur<n){
    let j=Math.floor(rnd()*(n-1)); if(j>=cur) j++; return j;
  }
  return draw(c);
}
// Smoothness without downloading the library: the NEXT random roll is chosen ahead of time and
// its layers are fetched while you look at the current one, so Random swaps instantly. The
// roll is drawn with the same pick() rules (weights, no-repeat) against the current state and
// re-drawn whenever the state changes, so odds are exactly as before. Stepping a category also
// warms the next two options in that direction.
// Up to 3 future rolls are queued as a chain (each drawn from the one before it with the same
// pick() rules, so weights and no-repeat are exactly as if you rolled live) and downloaded one
// roll at a time, nearest first, so even rapid tapping stays on art that is already on the device.
let rollQ=[], qBase=null, lastStep=null;
const QUEUE=3;
function rollFrom(base){ const saved=snapshot(); Object.assign(state,base);
  const r={}; CATS.forEach(c=>{ r[c.name]=pick(c); }); Object.assign(state,saved); return r; }
function rollReady(r){ return CATS.every(c=>{ const o=c.options[r[c.name]]; if(!(o&&o.src)) return true; const im=imgs.get(o.src); return im&&(im._ok||im._bad); }); }
function planNext(){
  const key=stateKey();
  if(qBase!==key){ rollQ=[]; qBase=key; }
  let prev=rollQ.length?rollQ[rollQ.length-1]:snapshot();
  while(rollQ.length<QUEUE){ prev=rollFrom(prev); rollQ.push(prev); }
  clearTimeout(planNext._t);
  planNext._t=setTimeout(()=>{
    if(document.querySelector('.frame').classList.contains('loading')) return;   // current look first
    const r=rollQ.find(x=>!rollReady(x));       // nearest roll that still needs downloading
    if(r) CATS.forEach(c=>{ const o=c.options[r[c.name]]; if(o&&o.src) layer(o); });
    if(lastStep){ const c=CATS.find(x=>x.name===lastStep.cat), n=c.options.length;
      for(let k=1;k<=2;k++){ const o=c.options[(state[c.name]+k*lastStep.d+n*4)%n]; if(o&&o.src) layer(o); } }
  }, 60);
}
function buildControls(){
  const box=$('controls');
  CATS.forEach(c=>{
    const real=c.options.some(o=>o.src);
    const panel=document.createElement('div'); panel.className='panel';
    const row=document.createElement('div'); row.className='cat'+(real?'':' empty'); row.dataset.cat=c.name;
    row.innerHTML='<div class="meta"><span class="caret">▼</span><div><div class="lbl"></div>'+
      '<div class="val"><span class="name">—</span><span class="count"></span></div></div></div>'+
      '<div class="stepper"><button class="step" data-d="-1" '+(real?'':'disabled')+'>‹</button>'+
      '<button class="step" data-d="1" '+(real?'':'disabled')+'>›</button></div>';
    row.querySelector('.lbl').textContent=c.name;
    row.querySelectorAll('.step').forEach(b=>b.setAttribute('aria-label',(b.dataset.d<0?'Previous ':'Next ')+c.name));
    panel.appendChild(row);
    if(real){
      row.querySelectorAll('.step').forEach(b=>b.onclick=()=>{ const n=c.options.length; state[c.name]=(state[c.name]+(+b.dataset.d)+n)%n; lastStep={cat:c.name,d:+b.dataset.d}; render(); });
      let built=false;
      function buildThumbs(){ if(built)return; built=true;
        const tb=document.createElement('div'); tb.className='thumbs';
        c.options.forEach((o,i)=>{
          const b=document.createElement('button'); b.className='thumb'+(c.name==='Background'?' bgthumb':'')+(o.src?'':' none');
          b.setAttribute('aria-label',o.name); b.title=o.name; b.setAttribute('aria-pressed', i===state[c.name]);
          if(o.src){ const im=document.createElement('img'); im.loading='lazy'; im.decoding='async'; im.src=o.thumb; im.alt=o.name;
            im.onerror=()=>{ im.onerror=null; im.src=o.src; }; b.appendChild(im); } else { b.textContent='NONE'; }
          b.onpointerdown=()=>{ if(o.src) layer(o); };   // start the download on touch, before the tap completes
          b.onclick=()=>{ state[c.name]=i; lastStep=null; render(); };
          tb.appendChild(b);
        });
        panel.appendChild(tb);
      }
      row.querySelector('.meta').onclick=()=>{
        const wasOpen=panel.classList.contains('open');
        box.querySelectorAll('.panel.open').forEach(p=>p.classList.remove('open'));
        if(!wasOpen){ buildThumbs(); panel.classList.add('open'); render(); panel.scrollIntoView({block:'nearest',behavior:'smooth'}); }
      };
    }
    box.appendChild(panel);
  });
}
function liveText(){ return 'Live: '+CATS.filter(c=>c.options.some(o=>o.src)).map(c=>c.name+' \u00B7'+c.options.filter(o=>o.src).length).join('   '); }
async function boot(){
  try{ M = await (await fetch('traits/manifest.json',{cache:'no-cache'})).json(); }
  catch(e){ $('status').textContent='Could not load traits/manifest.json — serve this folder (https or localhost) instead of opening the file.'; return; }
  SZ = M.canvas||1000; canvas.width=SZ; canvas.height=SZ;
  CATS = M.categories.map(cat=>({ name:cat.name, options:cat.options.map(o=>({ name:o.name, weight:o.weight,
    src: o.file ? 'layers/'+cat.name+'/'+o.file.replace(/\.png$/i,'.webp') : null,
    png: o.file ? 'traits/'+cat.name+'/'+o.file : null,
    thumb: o.file ? 'thumbs/'+cat.name+'/'+o.file.replace(/\.png$/i,'.webp') : null })) }));
  CATS.forEach(c=>{ state[c.name]=0; });
  buildControls(); render();
  $('status').textContent=liveText();
}
const doRandom=()=>{ if(!M) return;
  const r=(qBase===stateKey()&&rollQ.length)?rollQ.shift():rollFrom(snapshot());
  CATS.forEach(c=>state[c.name]=r[c.name]); qBase=stateKey(); lastStep=null; wantShimmer=true; render(); };
// --- Save -------------------------------------------------------------------
// Always the highest quality the site holds: the full 1000×1000 composite exported as a
// lossless PNG, every layer drawn 1:1 from art that is pixel-identical to the masters.
// Delivery adapts to the device, because "download" means different things everywhere:
//  · Desktop browsers → direct download of the PNG file.
//  · Phones/tablets with a share sheet (iPhone Safari, Android Chrome, installed app) →
//    share sheet straight away ("Save Image" puts it in Photos).
//  · Anything that blocks those (in-app browsers like X/Instagram, older phones, a share that
//    fails) → a save sheet showing the PNG with a real Download button and press-and-hold save.
// The PNG is built synchronously inside the tap, so iOS keeps the tap's permission for share().
const inApp=/Twitter|FBAN|FBAV|Instagram|Line\/|Telegram|; wv\)/i.test(navigator.userAgent);
const touch=matchMedia('(pointer: coarse)').matches;
let saveURL=null;
function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return 'nuddie-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())+'.png'; }
function exportPNG(sel){
  ctx.clearRect(0,0,SZ,SZ); if(!bgActive()) backdrop(); sel.forEach(im=>ctx.drawImage(im,0,0,SZ,SZ));
  const url=canvas.toDataURL('image/png');             // lossless PNG at full canvas size
  const bin=atob(url.split(',')[1]), u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  const name=stamp();
  return { name, blob:new Blob([u8],{type:'image/png'}), file:(typeof File==='function')?new File([u8],name,{type:'image/png'}):null };
}
function canShareFile(f){ try{ return !!(f && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; } }
function openSheet(out, msg){
  if(saveURL) URL.revokeObjectURL(saveURL);
  saveURL=URL.createObjectURL(out.blob);
  $('saveImg').src=saveURL;
  const link=$('saveLink'); link.href=saveURL; link.download=out.name;
  const sh=$('saveShare'); sh.hidden=!canShareFile(out.file);
  sh.onclick=async()=>{ try{ await navigator.share({files:[out.file],title:'Nuddie'}); }catch(e){} };
  $('saveHint').textContent=msg||(touch?'Press and hold the image to save it, or use a button below':'Your Nuddie is ready');
  $('saveSheet').hidden=false;
}
$('saveClose').onclick=()=>{ $('saveSheet').hidden=true; };
$('saveSheet').addEventListener('click',e=>{ if(e.target.id==='saveSheet') $('saveSheet').hidden=true; });
addEventListener('keydown',e=>{ if(e.key==='Escape') $('saveSheet').hidden=true; });
const doSave=async()=>{
  if(!M) return;
  // Every selected layer must be fully decoded first; a layer that failed to load aborts the
  // save rather than exporting a Nuddie with a trait missing.
  const sel=selected().map(layer);
  const waited=sel.some(im=>!im._ok&&!im._bad);
  if(waited){
    $('status').textContent='Preparing your full-quality PNG…';
    const t0=Date.now(); while(sel.some(im=>!im._ok&&!im._bad) && Date.now()-t0<30000) await new Promise(r=>setTimeout(r,60));
    await Promise.all(sel.map(im=> im.decode?im.decode().catch(()=>{}):Promise.resolve()));
    $('status').textContent=liveText();
  }
  const missing=sel.filter(im=>!im._ok||!im.naturalWidth).length;
  if(missing){ alert('Not saved: '+missing+' trait layer(s) failed to load. Check your connection and try again.'); return; }
  const out=exportPNG(sel);
  // Phones: share sheet first, but only while the tap is still "live" — after a wait, the save
  // sheet's own buttons provide a fresh tap.
  if((touch||inApp) && !waited && canShareFile(out.file)){
    try{ await navigator.share({files:[out.file],title:'Nuddie'}); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  if(touch||inApp){ openSheet(out); return; }
  // Desktop: direct download of the PNG file.
  if(saveURL) URL.revokeObjectURL(saveURL);
  saveURL=URL.createObjectURL(out.blob);
  const a=document.createElement('a'); a.download=out.name; a.href=saveURL; a.style.display='none';
  document.body.appendChild(a); a.click(); a.remove();
};
['randomAll','randomAllM'].forEach(id=>{const b=$(id); if(b) b.onclick=doRandom;});
['download','downloadM'].forEach(id=>{const b=$(id); if(b) b.onclick=doSave;});
boot();

/* PWA: offline cache + install. Needs https or localhost; skipped on file://. */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let installEvt=null;
const showInstall=v=>{ $('install').hidden=!v; $('installRowM').hidden=!v; };
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; showInstall(true); });
const doInstall=async()=>{ if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(()=>{}); installEvt=null; showInstall(false); };
$('install').onclick=doInstall; $('installM').onclick=doInstall;
addEventListener('appinstalled',()=>{ installEvt=null; showInstall(false); });
</script>
</body>
</html>
