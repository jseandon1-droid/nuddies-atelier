# One-time pull of the full Nuddies collection list (public on-chain data, no keys).
# Runs only on the collection-data branch; never touches the live site.
name: Collection pull
on:
  push:
    branches: [collection-data]
    paths: ['tools-collection/**', '.github/workflows/collection-pull.yml']
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            tools-collection
            collection
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund sharp@0.33.5
      - run: node tools-collection/images.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection
          git commit -q -m "Collection thumbs [skip ci]" || echo "nothing to commit"
          git push
